<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f9fb">
<title>Getränkerechner – Eggenburger Stadtkrug</title>


<style>
:root{
  --ink:#1f1712;
  --muted:#536071;
  --paper:#fbf4e8;
  --panel:#ffffff;
  --line:#d7dee6;
  --blue:#cfeaff;
  --blue-border:#3da0ef;
  --yellow:#ffe79a;
  --yellow-border:#e6ad16;
  --orange:#ffc79a;
  --orange-border:#ef7f30;
  --pink:#f7b6d3;
  --pink-border:#e55c9b;
  --green:#dff4d7;
  --green-border:#68b56d;
  --red:#df2f2f;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 18% 15%, rgba(121,82,42,.05) 0 1px, transparent 1.5px),
    radial-gradient(circle at 72% 24%, rgba(121,82,42,.04) 0 1px, transparent 1.5px),
    radial-gradient(circle at 36% 79%, rgba(121,82,42,.035) 0 1px, transparent 1.5px),
    #fbf4e8;
  background-size:22px 22px, 28px 28px, 31px 31px, auto;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
body{padding:0}
.app{
  max-width:1180px;
  margin:0 auto;
  padding:14px 24px calc(28px + env(safe-area-inset-bottom));
}
.header{
  display:grid;
  grid-template-columns:170px 1fr 160px;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.castle{
  font-family:Georgia,"Times New Roman",serif;
  font-size:38px;
  text-align:left;
  opacity:.8;
  letter-spacing:-5px;
  white-space:nowrap;
}
.title-wrap{text-align:center}
.title{
  font-family:Georgia,"Times New Roman",serif;
  font-size:48px;
  line-height:1;
  font-weight:800;
  letter-spacing:-1.5px;
}
.subtitle{display:none}
.cheers{
  font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;
  font-size:34px;
  text-align:right;
  transform:rotate(-5deg);
  color:#442319;
}
.total-card{
  background:linear-gradient(#f5f9fd,#e8f0f7);
  border:1.5px solid #bbc9d6;
  border-radius:15px;
  text-align:center;
  padding:8px 14px 11px;
  margin-bottom:8px;
  box-shadow:0 2px 7px rgba(0,0,0,.05);
}
.total-label{
  color:#425066;
  font-size:22px;
  font-weight:800;
}
.total{
  font-size:62px;
  line-height:1;
  font-weight:950;
  color:#103d13;
  margin-top:1px;
}
.deposit-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:7px 0 10px;
}
.deposit-btn{
  min-height:82px;
  border-radius:14px;
  border:1.5px solid var(--blue-border);
  background:linear-gradient(135deg,#d9efff,#b9ddfb);
  color:#183a61;
  padding:10px 16px;
  font-size:23px;
  font-weight:900;
  touch-action:manipulation;
  box-shadow:0 2px 6px rgba(0,0,0,.04);
}
.deposit-btn:active,.item:active,.action:active{transform:scale(.985)}
.section-title{display:none}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px 10px;
}
.item{
  position:relative;
  overflow:hidden;
  min-height:112px;
  border:1.5px solid;
  border-radius:14px;
  padding:12px 15px;
  display:grid;
  grid-template-columns:92px 1fr auto;
  align-items:center;
  gap:10px;
  text-align:left;
  cursor:pointer;
  touch-action:manipulation;
  box-shadow:0 2px 6px rgba(0,0,0,.04);
}
.item .icon{
  font-size:54px;
  line-height:1;
  text-align:center;
  white-space:nowrap;
  z-index:2;
}
.item .info{z-index:2;min-width:0}
.item .name{
  font-size:23px;
  line-height:1.08;
  font-weight:900;
}
.item .size{
  margin-top:5px;
  font-size:20px;
  font-weight:800;
}
.item .price{
  font-size:24px;
  font-weight:950;
  align-self:end;
  white-space:nowrap;
  z-index:2;
}
.beer{
  background:linear-gradient(135deg,#fff3b7,#ffd85d);
  border-color:var(--yellow-border);
}
.wine{
  background:linear-gradient(135deg,#ffd7b5,#ff9d61);
  border-color:var(--orange-border);
}
.juice{
  background:linear-gradient(135deg,#ffd2e5,#f49bc2);
  border-color:var(--pink-border);
}
.soda{
  background:linear-gradient(135deg,#dff3ff,#aed8f0);
  border-color:#74b4d6;
}
.has-soda::before,
.has-soda::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:1;
}
.has-soda::before{
  background-image:
    radial-gradient(circle at 5% 20%, transparent 0 6px, rgba(255,255,255,.95) 6.5px 8px, transparent 8.5px),
    radial-gradient(circle at 12% 55%, transparent 0 4px, rgba(255,255,255,.98) 4.5px 6px, transparent 6.5px),
    radial-gradient(circle at 20% 82%, transparent 0 5px, rgba(255,255,255,.95) 5.5px 7px, transparent 7.5px),
    radial-gradient(circle at 29% 28%, transparent 0 3px, rgba(255,255,255,.98) 3.5px 5px, transparent 5.5px),
    radial-gradient(circle at 36% 67%, transparent 0 6px, rgba(255,255,255,.96) 6.5px 8px, transparent 8.5px),
    radial-gradient(circle at 44% 12%, transparent 0 4px, rgba(255,255,255,.97) 4.5px 6px, transparent 6.5px),
    radial-gradient(circle at 51% 48%, transparent 0 5px, rgba(255,255,255,.98) 5.5px 7px, transparent 7.5px),
    radial-gradient(circle at 58% 86%, transparent 0 3px, rgba(255,255,255,.95) 3.5px 5px, transparent 5.5px),
    radial-gradient(circle at 66% 26%, transparent 0 6px, rgba(255,255,255,.97) 6.5px 8px, transparent 8.5px),
    radial-gradient(circle at 73% 60%, transparent 0 4px, rgba(255,255,255,.98) 4.5px 6px, transparent 6.5px),
    radial-gradient(circle at 81% 12%, transparent 0 3px, rgba(255,255,255,.95) 3.5px 5px, transparent 5.5px),
    radial-gradient(circle at 88% 42%, transparent 0 5px, rgba(255,255,255,.97) 5.5px 7px, transparent 7.5px),
    radial-gradient(circle at 95% 78%, transparent 0 4px, rgba(255,255,255,.98) 4.5px 6px, transparent 6.5px);
}
.has-soda::after{
  background-image:
    radial-gradient(circle at 9% 36%, rgba(255,255,255,.95) 0 2px, transparent 2.5px),
    radial-gradient(circle at 18% 10%, rgba(255,255,255,.95) 0 2.5px, transparent 3px),
    radial-gradient(circle at 27% 52%, rgba(255,255,255,.9) 0 2px, transparent 2.5px),
    radial-gradient(circle at 39% 89%, rgba(255,255,255,.95) 0 2px, transparent 2.5px),
    radial-gradient(circle at 47% 31%, rgba(255,255,255,.95) 0 2.5px, transparent 3px),
    radial-gradient(circle at 57% 62%, rgba(255,255,255,.9) 0 2px, transparent 2.5px),
    radial-gradient(circle at 68% 77%, rgba(255,255,255,.95) 0 2.5px, transparent 3px),
    radial-gradient(circle at 76% 39%, rgba(255,255,255,.95) 0 2px, transparent 2.5px),
    radial-gradient(circle at 86% 91%, rgba(255,255,255,.95) 0 2px, transparent 2.5px),
    radial-gradient(circle at 94% 18%, rgba(255,255,255,.95) 0 2.5px, transparent 3px);
}
.food-title{
  background:linear-gradient(90deg,#d5efcf,#edf8e8);
  border-radius:11px;
  padding:6px 14px;
  margin-top:10px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:27px;
  font-weight:900;
  color:#18451f;
}
.food-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:7px;
}
.food{
  min-height:88px;
  background:linear-gradient(135deg,#ecf9e8,#d2edca);
  border-color:var(--green-border);
  grid-template-columns:1fr auto;
}
.food .icon{display:none}
.food .name{font-size:20px}
.food .price{font-size:21px}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}
.action{
  min-height:66px;
  border-radius:12px;
  border:1.5px solid;
  font-size:22px;
  font-weight:900;
  touch-action:manipulation;
}
.undo{
  background:linear-gradient(#ef3d3d,#d52323);
  color:#fff;
  border-color:#c31d1d;
}
.undo:disabled{opacity:.42}
.reset{
  background:linear-gradient(#f9fbfd,#e8edf2);
  color:#425066;
  border-color:#c3ced9;
}
.order{
  margin-top:10px;
  background:#fff;
  border:1.5px solid #ccd6df;
  border-radius:12px;
  padding:10px 16px 12px;
}
.order-head,
.order-row,
.order-total{
  display:grid;
  grid-template-columns:1fr 95px 140px;
  gap:12px;
  align-items:center;
}
.order-head{
  color:#556274;
  font-size:16px;
  padding-bottom:7px;
  border-bottom:1px solid #dfe5eb;
}
.order-head strong{
  color:#3b4858;
  font-size:20px;
}
.order-row{
  padding:6px 0;
  font-size:17px;
  border-bottom:1px solid #edf0f3;
}
.order-row .qty{text-align:center}
.order-row .sum{text-align:right;font-weight:800}
.empty{
  color:#657286;
  text-align:center;
  padding:26px 0 28px;
  font-size:18px;
  font-style:italic;
}
.order-total{
  margin-top:8px;
  padding-top:10px;
  border-top:1.5px solid #d5dde5;
  font-size:20px;
  font-weight:950;
}
.order-total .total-number{
  grid-column:3;
  text-align:right;
}
@media(max-width:820px){
  .app{padding-left:12px;padding-right:12px}
  .header{grid-template-columns:100px 1fr 100px}
  .castle{font-size:27px}
  .title{font-size:35px}
  .cheers{font-size:26px}
  .total{font-size:52px}
  .item{grid-template-columns:70px 1fr auto;min-height:105px}
  .item .icon{font-size:46px}
  .item .name{font-size:20px}
  .item .size{font-size:18px}
  .item .price{font-size:21px}
}
@media(max-width:640px){
  .header{grid-template-columns:1fr auto}
  .castle{display:none}
  .title-wrap{text-align:left}
  .title{font-size:31px}
  .cheers{font-size:24px}
  .grid{grid-template-columns:1fr 1fr}
  .item{
    grid-template-columns:54px 1fr;
    gap:8px;
    min-height:118px;
    padding:10px;
  }
  .item .icon{font-size:39px}
  .item .price{
    grid-column:2;
    justify-self:end;
    align-self:end;
    font-size:20px;
  }
  .item .name{font-size:17px}
  .item .size{font-size:17px}
  .food-grid{grid-template-columns:1fr}
  .actions{grid-template-columns:1fr}
  .deposit-btn{font-size:18px;min-height:72px}
  .order-head,.order-row,.order-total{
    grid-template-columns:1fr 55px 95px;
    gap:6px;
  }
}

.deposit-qty-control{
  display:grid;
  grid-template-columns:64px 1fr 64px;
  gap:10px;
  align-items:center;
  margin:12px 0 18px;
  padding:12px;
  border-radius:14px;
  background:#dcecf4;
  border:1.5px solid rgba(0,0,0,.16);
}
.deposit-qty-center{
  display:grid;
  grid-template-columns:1fr 68px auto;
  gap:10px;
  align-items:center;
  min-width:0;
}
.deposit-qty-label{font-weight:900;font-size:18px;}
.deposit-qty-price{font-weight:800;white-space:nowrap;}
@media(max-width:640px){
  .deposit-qty-control{grid-template-columns:58px 1fr 58px;}
  .deposit-qty-center{grid-template-columns:1fr 58px;}
  .deposit-qty-price{grid-column:1 / -1;text-align:center;font-size:14px;}
}

</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#efe3c6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mittelalterfest">
<link rel="apple-touch-icon" href="icon.svg">
</head>

<body>
<div class="app">
  <div class="header">
    <div class="castle">♜⌂♜⌂♜</div>
    <div class="title-wrap">
      <div class="title">Mittelalterfest Eggenburg</div>
    </div>
    <div class="cheers">Tanja ♡</div>
  </div>

  <div class="total-card">
    <div class="total-label">Gesamtsumme</div>
    <div class="total" id="total">0,00 €</div>
  </div>

  <div class="deposit-grid">
    <div class="deposit-qty-control">
        <button class="qty-btn minus-btn" type="button" onclick="returnDeposit()" aria-label="Ein Glas retour">−</button>
        <div class="deposit-qty-center">
          <div class="deposit-qty-label">🥛 Glaseinsatz</div>
          <div class="qty-display" id="count-glass">0</div>
          <div class="deposit-qty-price">7,00 € / Glas</div>
        </div>
        <button class="qty-btn plus-btn" type="button" onclick="addDeposit()" aria-label="Ein Glaseinsatz hinzufügen">+</button>
      </div>
  </div>

  <div class="section-title">Getränke</div>
  <div id="drinkGrid" class="grid">
    <button class="item beer" onclick="addItem('bier_radler033')">
      <div class="icon">🍺</div><div class="info"><div class="name">Bier / Radler</div><div class="size">1/3 l</div></div><div class="price">4,50 €</div>
    </button>
    <button class="item beer" onclick="addItem('bier_radler05')">
      <div class="icon">🍺</div><div class="info"><div class="name">Bier / Radler</div><div class="size">1/2 l</div></div><div class="price">5,50 €</div>
    </button>

    <button class="item wine" onclick="addItem('sturm_spritzer_kaiser033')">
      <div class="icon">🥛</div><div class="info"><div class="name">Sturm / Spritzer / Kaiser</div><div class="size">1/3 l</div></div><div class="price">4,00 €</div>
    </button>
    <button class="item wine" onclick="addItem('sturm_spritzer_kaiser05')">
      <div class="icon">🥛</div><div class="info"><div class="name">Sturm / Spritzer / Kaiser</div><div class="size">1/2 l</div></div><div class="price">5,00 €</div>
    </button>

    <button class="item wine" onclick="addItem('wein')">
      <div class="icon">🍷</div><div class="info"><div class="name">Wein</div><div class="size">1/8 l</div></div><div class="price">2,50 €</div>
    </button>
    <button class="item wine" onclick="addItem('schnaps')">
      <div class="icon">🥃</div><div class="info"><div class="name">Schnaps</div><div class="size">2 cl</div></div><div class="price">2,00 €</div>
    </button>

    <button class="item juice" onclick="addItem('saftpur033')">
      <div class="icon">🍇</div><div class="info"><div class="name">Apfel / Traube pur</div><div class="size">1/3 l</div></div><div class="price">3,50 €</div>
    </button>
    <button class="item juice" onclick="addItem('saftpur05')">
      <div class="icon">🍇</div><div class="info"><div class="name">Apfel / Traube pur</div><div class="size">1/2 l</div></div><div class="price">4,50 €</div>
    </button>

    <button class="item juice has-soda" onclick="addItem('saft_soda033')">
      <div class="icon">🧺</div><div class="info"><div class="name">Apfel / Traube / Himbeer / Holler mit Soda</div><div class="size">1/3 l</div></div><div class="price">3,00 €</div>
    </button>
    <button class="item juice has-soda" onclick="addItem('saft_soda05')">
      <div class="icon">🧺</div><div class="info"><div class="name">Apfel / Traube / Himbeer / Holler mit Soda</div><div class="size">1/2 l</div></div><div class="price">3,50 €</div>
    </button>

    <button class="item juice" onclick="addItem('saftwasser033')">
      <div class="icon">🍇</div><div class="info"><div class="name">Apfel / Traube Leitung</div><div class="size">1/3 l</div></div><div class="price">2,50 €</div>
    </button>
    <button class="item juice" onclick="addItem('saftwasser05')">
      <div class="icon">🍇</div><div class="info"><div class="name">Apfel / Traube Leitung</div><div class="size">1/2 l</div></div><div class="price">3,50 €</div>
    </button>

    <button class="item juice" onclick="addItem('himb_wasser033')">
      <div class="icon">🌼</div><div class="info"><div class="name">Himbeer / Holler Leitung</div><div class="size">1/3 l</div></div><div class="price">2,00 €</div>
    </button>
    <button class="item juice" onclick="addItem('himb_wasser05')">
      <div class="icon">🌼</div><div class="info"><div class="name">Himbeer / Holler Leitung</div><div class="size">1/2 l</div></div><div class="price">2,50 €</div>
    </button>

    <button class="item soda has-soda" onclick="addItem('soda033')">
      <div class="icon">🥤</div><div class="info"><div class="name">Soda</div><div class="size">1/3 l</div></div><div class="price">3,00 €</div>
    </button>
    <button class="item soda has-soda" onclick="addItem('soda05')">
      <div class="icon">🥤</div><div class="info"><div class="name">Soda</div><div class="size">1/2 l</div></div><div class="price">3,50 €</div>
    </button>
  </div>

  <div class="food-title">Speisen</div>
  <div id="foodGrid" class="food-grid">
    <button class="item food" onclick="addItem('fleischbrot')">
      <div class="info"><div class="name">Fleischbrot</div></div><div class="price">5,00 €</div>
    </button>
    <button class="item food" onclick="addItem('aufstrichbrot')">
      <div class="info"><div class="name">Aufstrichbrot</div></div><div class="price">3,50 €</div>
    </button>
    <button class="item food" onclick="addItem('schmalzbrot')">
      <div class="info"><div class="name">Schmalzbrot</div></div><div class="price">3,00 €</div>
    </button>
  </div>

  <div class="actions">
    <button id="undoBtn" class="action undo" onclick="undoLast()" disabled>↩ Letzte Eingabe zurück</button>
    <button class="action reset" onclick="resetAll()">🗑 Alles löschen</button>
  </div>

  <section class="order">
    <div class="order-head">
      <strong>Aktuelle Bestellung</strong>
      <span style="text-align:center">Anzahl</span>
      <span style="text-align:right">Summe</span>
    </div>
    <div id="summary"></div>
    <div class="order-total">
      <span>Gesamtsumme</span>
      <span class="total-number" id="bottomTotal">0,00 €</span>
    </div>
  </section>
</div>

<script>
const items = [
  {id:"bier_radler033", name:"Bier / Radler", size:"1/3 l", price:4.50, type:"beer", icon:"🍺"},
  {id:"bier_radler05",  name:"Bier / Radler", size:"1/2 l", price:5.50, type:"beer", icon:"🍺"},

  {id:"sturm_spritzer_kaiser033", name:"Sturm / Spritzer / Kaiser", size:"1/3 l", price:4.00, type:"wine", icon:"🥛"},
  {id:"sturm_spritzer_kaiser05",  name:"Sturm / Spritzer / Kaiser", size:"1/2 l", price:5.00, type:"wine", icon:"🥛"},

  {id:"wein", name:"Wein", size:"1/8 l", price:2.50, type:"wine", icon:"🍷"},
  {id:"schnaps", name:"Schnaps", size:"2 cl", price:2.00, type:"wine", icon:"🥃"},

  {id:"saftpur033", name:"Apfel / Traube pur", size:"1/3 l", price:3.50, type:"juice", icon:"🍇"},
  {id:"saftpur05",  name:"Apfel / Traube pur", size:"1/2 l", price:4.50, type:"juice", icon:"🍇"},

  {id:"saft_soda033", name:"Apfel / Traube / Himbeer / Holler mit Soda", size:"1/3 l", price:3.00, type:"juice", icon:"🧺", soda:true},
  {id:"saft_soda05",  name:"Apfel / Traube / Himbeer / Holler mit Soda", size:"1/2 l", price:3.50, type:"juice", icon:"🧺", soda:true},

  {id:"saftwasser033", name:"Apfel / Traube Leitung", size:"1/3 l", price:2.50, type:"juice", icon:"🍇"},
  {id:"saftwasser05",  name:"Apfel / Traube Leitung", size:"1/2 l", price:3.50, type:"juice", icon:"🍇"},

  {id:"himb_wasser033", name:"Himbeer / Holler Leitung", size:"1/3 l", price:2.00, type:"juice", icon:"🌼"},
  {id:"himb_wasser05",  name:"Himbeer / Holler Leitung", size:"1/2 l", price:2.50, type:"juice", icon:"🌼"},

  {id:"soda033", name:"Soda", size:"1/3 l", price:3.00, type:"soda", icon:"🥤", soda:true},
  {id:"soda05",  name:"Soda", size:"1/2 l", price:3.50, type:"soda", icon:"🥤", soda:true},

  {id:"glaseinsatz", name:"Glaseinsatz", price:7.00, type:"deposit"},
  {id:"glasretour", name:"Glas retour", price:-7.00, type:"deposit"},

  {id:"fleischbrot", name:"Fleischbrot", price:5.00, type:"food"},
  {id:"aufstrichbrot", name:"Aufstrichbrot", price:3.50, type:"food"},
  {id:"schmalzbrot", name:"Schmalzbrot", price:3.00, type:"food"}
];

let history = [];

function euro(v){
  return v.toLocaleString("de-AT",{
    style:"currency",
    currency:"EUR",
    minimumFractionDigits:2
  });
}

function addDeposit(){
  addItem("glaseinsatz");
}

function returnDeposit(){
  addItem("glasretour");
}

function addItem(id){
  history.push(id);
  save();
  render();
}

function undoLast(){
  if(!history.length) return;
  history.pop();
  save();
  render();
}

function resetAll(){
  // Sofort alles vollständig zurücksetzen.
  history.length = 0;

  // Auch ältere gespeicherte Versionen entfernen.
  try{
    localStorage.removeItem("stadtkrugCalculatorV4");
    localStorage.removeItem("stadtkrugCalculatorV5");
    localStorage.removeItem("stadtkrugCalculatorV6");
    localStorage.removeItem("stadtkrugCalculatorV7");
    localStorage.removeItem("stadtkrugCalculatorV12");
    localStorage.removeItem("stadtkrugCalculatorV13");
    localStorage.removeItem("stadtkrugCalculatorV14");
  }catch(e){}

  // Leeren Zustand speichern.
  try{
    localStorage.setItem("stadtkrugCalculatorV14", JSON.stringify([]));
  }catch(e){}

  // Oberfläche zuverlässig zurücksetzen.
  document.getElementById("total").textContent = euro(0);
  document.getElementById("bottomTotal").textContent = euro(0);
  document.getElementById("undoBtn").disabled = true;

  const summary = document.getElementById("summary");
  summary.innerHTML = '<div class="empty">Noch keine Artikel eingegeben.</div>';

  // Danach den gesamten Zustand noch einmal neu zeichnen.
  render();
}

function save(){
  try{
    localStorage.setItem("stadtkrugCalculatorV14", JSON.stringify(history));
  }catch(e){
    // Rechner funktioniert auch ohne Browser-Speicher.
  }
}

function load(){
  try{
    const saved=JSON.parse(localStorage.getItem("stadtkrugCalculatorV12")||"[]");
    if(Array.isArray(saved)) history=saved;
  }catch(e){history=[];}
}

function render(){
  let total=0;
  const counts={};

  history.forEach(id=>{
    const item=items.find(x=>x.id===id);
    if(!item) return;
    total+=item.price;
    counts[id]=(counts[id]||0)+1;
  });

  document.getElementById("total").textContent=euro(total);
  document.getElementById("bottomTotal").textContent=euro(total);
  document.getElementById("undoBtn").disabled=!history.length;

  const summary=document.getElementById("summary");
  summary.innerHTML="";

  if(!history.length){
    summary.innerHTML=`<div class="empty">Noch keine Artikel eingegeben.</div>`;
    return;
  }

  [...new Set(history)].forEach(id=>{
    const item=items.find(x=>x.id===id);
    const qty=counts[id];
    const row=document.createElement("div");
    row.className="order-row";
    const label=item.size ? `${item.name} ${item.size}` : item.name;
    row.innerHTML=`
      <div>${label}</div>
      <div class="qty">${qty}</div>
      <div class="sum">${euro(qty*item.price)}</div>
    `;
    summary.appendChild(row);
  });
}

load();
render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./service-worker.js').catch(function () {});
  });
}
</script>
</body>
</html>
